<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Fretes e Mudanças</title>

  <style>
    @font-face {
      font-family: 'DesdemonaFont';
      src: url('desdemona.ttf') format('truetype'),
           url('desdemona.otf') format('opentype');
      font-display: swap;
    }

    @font-face {
      font-family: 'HerculanoFont';
      src: url('herculano.ttf') format('truetype'),
           url('herculano.otf') format('opentype');
      font-display: swap;
    }

    @font-face {
      font-family: 'CopperplateFont';
      src: url('copperplate.ttf') format('truetype'),
           url('copperplate.otf') format('opentype');
      font-display: swap;
    }

    :root {
      --bg-laranja: #f7a748;
      --marrom-escuro: #381604;
      --preto: #000000;
      --branco: #ffffff;
      --card-bg: #fffbf5;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      font-family: 'CopperplateFont', 'Cinzel', serif;
      color: var(--preto);
    }

    .font-desdemona {
      font-family: 'DesdemonaFont', 'Cinzel Decorative', serif;
      color: var(--marrom-escuro);
      letter-spacing: 1.5px;
    }

    .font-herculano {
      font-family: 'HerculanoFont', 'Cinzel', serif;
      color: var(--preto);
      letter-spacing: 1px;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow-x: hidden;
      background-color: var(--bg-laranja);
    }

    .app-viewport {
      width: 100%;
      min-height: 100dvh;
      max-width: 480px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      position: relative;
      background-color: var(--bg-laranja);
      padding: env(safe-area-inset-top, 12px) 16px env(safe-area-inset-bottom, 16px) 16px;
    }

    .screen {
      display: none;
      flex: 1;
      width: 100%;
      flex-direction: column;
      justify-content: space-between;
      animation: fadeIn 0.2s ease-out;
    }
    .screen.active { display: flex; }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.98); }
      to { opacity: 1; transform: scale(1); }
    }

    .banner-wrapper {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 6px 0;
    }

    .logo-img {
      width: 100%;
      max-height: 40vh;
      object-fit: contain;
      border-radius: 18px;
      box-shadow: 0 10px 25px rgba(56, 22, 4, 0.25);
      border: 2px solid var(--marrom-escuro);
      background-color: #f7a748;
    }

    .mini-header {
      text-align: center;
      padding: 10px 0 14px 0;
    }
    .mini-header h2 { font-size: 1.4rem; line-height: 1.2; }
    .mini-header p { font-size: 0.8rem; margin-top: 2px; }

    .content-box {
      background: var(--card-bg);
      border: 2.5px solid var(--marrom-escuro);
      border-radius: 22px;
      padding: 16px;
      box-shadow: 0 8px 20px rgba(56, 22, 4, 0.2);
      display: flex;
      flex-direction: column;
      gap: 12px;
      flex: 1;
      margin-bottom: 12px;
      overflow-y: auto;
    }

    label { font-size: 0.85rem; font-weight: bold; color: var(--marrom-escuro); }
    
    textarea, input[type="text"], input[type="password"] {
      width: 100%;
      background: #ffffff;
      border: 2px solid var(--marrom-escuro);
      border-radius: 14px;
      padding: 12px;
      font-size: 1rem;
      user-select: text;
      outline: none;
    }

    /* Campo de senha nativo no programa */
    .input-senha {
      text-align: center;
      font-size: 1.8rem;
      letter-spacing: 8px;
      font-weight: bold;
      height: 60px;
    }

    .btn-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 100%;
      padding-bottom: 6px;
    }

    .btn {
      width: 100%;
      height: 56px;
      border-radius: 18px;
      font-size: 1rem;
      font-weight: 900;
      letter-spacing: 1px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      cursor: pointer;
      border: 2.5px solid var(--marrom-escuro);
      box-shadow: 0 5px 0 var(--marrom-escuro);
      transition: transform 0.1s, box-shadow 0.1s;
    }
    .btn:active {
      transform: translateY(4px);
      box-shadow: 0 1px 0 var(--marrom-escuro);
    }

    .btn-primary { background-color: var(--marrom-escuro); color: var(--branco); }
    .btn-primary * { color: var(--branco); }
    .btn-secondary { background-color: var(--branco); color: var(--marrom-escuro); }

    .question-row {
      background: #ffffff;
      border: 1.5px solid var(--marrom-escuro);
      border-radius: 12px;
      padding: 12px;
      display: flex;
      gap: 12px;
      align-items: flex-start;
      user-select: text;
    }
    .question-row input[type="checkbox"] {
      margin-top: 3px;
      transform: scale(1.3);
      accent-color: var(--marrom-escuro);
    }
    .badge-tag {
      background: var(--bg-laranja);
      color: var(--marrom-escuro);
      font-size: 0.7rem;
      font-weight: bold;
      padding: 2px 6px;
      border-radius: 4px;
      border: 1px solid var(--marrom-escuro);
      display: inline-block;
      margin-bottom: 4px;
    }

    .table-wrapper {
      max-height: 200px;
      overflow-y: auto;
      border: 1.5px solid var(--marrom-escuro);
      border-radius: 10px;
      background: #fff;
    }
    table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
    th, td { padding: 8px; border-bottom: 1px solid #eee; text-align: left; }
    th { background: #fdf2e2; position: sticky; top: 0; }
  </style>
</head>
<body>

<div class="app-viewport">

  <!-- ================= TELA 1: INICIAL ================= -->
  <section id="screen-home" class="screen active">
    <div class="banner-wrapper">
      <img src="logo.jpg" alt="Logo Fretes e Mudanças" class="logo-img" onerror="this.onerror=null; this.src='1000754056.jpg';">
    </div>

    <div style="flex: 1; display:flex; align-items:center; justify-content:center;">
      <span id="sync-status" style="font-size: 0.75rem; color: var(--marrom-escuro); font-weight: bold;">
        Carregando banco da planilha...
      </span>
    </div>

    <div class="btn-container">
      <button class="btn btn-primary" onclick="irPara('screen-trabalhar')">
        🚚 TRABALHAR
      </button>
      <button class="btn btn-secondary" onclick="irParaLogin()">
        ⚙️ CADASTRO
      </button>
    </div>
  </section>

  <!-- ================= TELA 2: SENHA DIRETO NO PROGRAMA ================= -->
  <section id="screen-login" class="screen">
    <div class="mini-header">
      <h2 class="font-desdemona">ÁREA RESTRITA</h2>
      <p class="font-herculano">DIGITE A SENHA DE ACESSO</p>
    </div>

    <div class="content-box" style="justify-content: center; align-items: center; text-align: center; gap: 14px;">
      <span style="font-size: 2.2rem;">🔒</span>
      <label for="input-senha-acesso" style="font-size: 0.95rem;">SENHA DO SISTEMA:</label>
      
      <!-- inputmode="numeric" faz subir o teclado numérico do próprio celular -->
      <input type="password" id="input-senha-acesso" class="input-senha" maxlength="6" inputmode="numeric" placeholder="••••" autocomplete="off">
      
      <div id="erro-senha" style="color: #dc2626; font-size: 0.85rem; font-weight: bold; min-height: 18px;"></div>
    </div>

    <div class="btn-container">
      <button class="btn btn-primary" onclick="verificarSenha()">
        ENTRAR NO CADASTRO ➔
      </button>
      <button class="btn btn-secondary" onclick="irPara('screen-home')">
        VOLTAR AO INÍCIO
      </button>
    </div>
  </section>

  <!-- ================= TELA 3: TRABALHAR ================= -->
  <section id="screen-trabalhar" class="screen">
    <div class="mini-header">
      <h2 class="font-desdemona">LISTA DO CLIENTE</h2>
      <p class="font-herculano">COLE O TEXTO DO WHATSAPP ABAIXO</p>
    </div>

    <div class="content-box">
      <label for="input-lista">Itens enviados:</label>
      <textarea id="input-lista" style="flex: 1; min-height: 180px;" placeholder="• 1 sofá de 3 lugares&#10;- 2 colchões casal&#10;geladeira duplex&#10;4 cadeiras e mesa"></textarea>
    </div>

    <div class="btn-container">
      <button class="btn btn-primary" onclick="processarItens()">
        AVANÇAR ➔
      </button>
      <button class="btn btn-secondary" onclick="irPara('screen-home')">
        VOLTAR AO INÍCIO
      </button>
    </div>
  </section>

  <!-- ================= TELA 4: PERGUNTAS GERADAS ================= -->
  <section id="screen-perguntas" class="screen">
    <div class="mini-header">
      <h2 class="font-desdemona">PERGUNTAS DO FRETE</h2>
      <p class="font-herculano">DESMARQUE O QUE NÃO PRECISAR</p>
    </div>

    <div class="content-box" id="lista-perguntas-container"></div>

    <div class="btn-container">
      <button class="btn btn-primary" onclick="copiarMensagemPronta()">
        📋 COPIAR PERGUNTAS
      </button>
      <button class="btn btn-secondary" onclick="irPara('screen-home')">
        VOLTAR AO INÍCIO
      </button>
    </div>
  </section>

  <!-- ================= TELA 5: CADASTRO ================= -->
  <section id="screen-cadastro" class="screen">
    <div class="mini-header">
      <h2 class="font-desdemona">CADASTRO NA PLANILHA</h2>
      <p class="font-herculano">SINCRONIZADO COM O GOOGLE SHEETS</p>
    </div>

    <div class="content-box">
      <div>
        <label for="cad-palavras">Palavras-chave (separadas por vírgula):</label>
        <input type="text" id="cad-palavras" placeholder="ex: sofa, estofado, poltrona">
      </div>

      <div>
        <label for="cad-pergunta">Pergunta para o cliente:</label>
        <textarea id="cad-pergunta" rows="2" placeholder="ex: O sofá desmonta em módulos ou é inteiro?"></textarea>
      </div>

      <button id="btn-salvar" class="btn btn-primary" style="height: 48px; border-radius: 12px;" onclick="adicionarNaPlanilha()">
        SALVAR NA PLANILHA
      </button>

      <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 6px;">
        <label>Itens na Planilha (<span id="total-cadastrados">0</span>):</label>
        <button onclick="carregarDadosPlanilha()" style="padding: 4px 8px; font-size: 0.75rem; border-radius: 6px; border: 1px solid var(--marrom-escuro); background: #fff; cursor: pointer;">
          🔄 Atualizar
        </button>
      </div>

      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th style="width: 40%;">Itens (Palavras)</th>
              <th>Pergunta</th>
            </tr>
          </thead>
          <tbody id="tabela-cadastros"></tbody>
        </table>
      </div>
    </div>

    <div class="btn-container">
      <button class="btn btn-secondary" onclick="irPara('screen-home')">
        VOLTAR AO INÍCIO
      </button>
    </div>
  </section>

</div>

<script>
  // COLE AQUI A SUA URL GERADA NO GOOGLE APPS SCRIPT:
  const URL_GOOGLE_APPS_SCRIPT = "SUA_URL_DO_APPS_SCRIPT_AQUI";

  let bancoOnline = [];

  function irPara(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
  }

  /* Fluxo de Senha Integrado no Programa */
  function irParaLogin() {
    const input = document.getElementById('input-senha-acesso');
    input.value = '';
    document.getElementById('erro-senha').textContent = '';
    irPara('screen-login');
    // Aciona diretamente o teclado numérico do aparelho celular
    setTimeout(() => {
      input.focus();
    }, 250);
  }

  function verificarSenha() {
    const input = document.getElementById('input-senha-acesso');
    const erro = document.getElementById('erro-senha');

    if (input.value === "2003") {
      erro.textContent = '';
      input.value = '';
      irPara('screen-cadastro');
      renderizarTabela();
    } else {
      erro.textContent = "Senha incorreta! Digite 2003.";
      input.value = '';
      input.focus();
    }
  }

  // Permite confirmar pressionando a tecla 'Ir'/'Enter' do teclado do celular
  document.getElementById('input-senha-acesso').addEventListener('keyup', function(e) {
    if (e.key === 'Enter') {
      verificarSenha();
    }
  });

  /* Sincronização com Google Sheets */
  async function carregarDadosPlanilha() {
    const statusEl = document.getElementById('sync-status');
    if (URL_GOOGLE_APPS_SCRIPT === "SUA_URL_DO_APPS_SCRIPT_AQUI") {
      statusEl.textContent = "⚠️ Configure a URL da planilha no script";
      return;
    }

    statusEl.textContent = "Sincronizando planilha...";
    try {
      const resp = await fetch(URL_GOOGLE_APPS_SCRIPT);
      bancoOnline = await resp.json();
      localStorage.setItem('cache_planilha_frete', JSON.stringify(bancoOnline));
      statusEl.textContent = `✅ Planilha conectada (${bancoOnline.length} itens)`;
      renderizarTabela();
    } catch (err) {
      statusEl.textContent = "Modo offline (dados locais)";
      const cache = localStorage.getItem('cache_planilha_frete');
      if (cache) {
        bancoOnline = JSON.parse(cache);
        renderizarTabela();
      }
    }
  }

  async function adicionarNaPlanilha() {
    const palavras = document.getElementById('cad-palavras').value.trim();
    const pergunta = document.getElementById('cad-pergunta').value.trim();
    const btnSalvar = document.getElementById('btn-salvar');

    if (!palavras || !pergunta) {
      alert("Preencha o item e a pergunta correspondente.");
      return;
    }

    btnSalvar.disabled = true;
    btnSalvar.textContent = "SALVANDO...";

    try {
      await fetch(URL_GOOGLE_APPS_SCRIPT, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ item: palavras, pergunta: pergunta })
      });

      alert("Item gravado na planilha!");
      document.getElementById('cad-palavras').value = '';
      document.getElementById('cad-pergunta').value = '';
      
      setTimeout(carregarDadosPlanilha, 1500);
    } catch (err) {
      alert("Erro ao gravar na planilha.");
    } finally {
      btnSalvar.disabled = false;
      btnSalvar.textContent = "SALVAR NA PLANILHA";
    }
  }

  /* Leitura de Texto, Bullets e Plurais */
  function normalizar(txt) {
    return txt.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').trim();
  }

  function radicalizar(palavra) {
    let p = normalizar(palavra);
    if (p.endsWith('oes') || p.endsWith('aes')) return p.slice(0, -3) + 'ao';
    if (p.endsWith('ais')) return p.slice(0, -3) + 'al';
    if (p.endsWith('eis')) return p.slice(0, -3) + 'el';
    if (p.endsWith('ois')) return p.slice(0, -3) + 'ol';
    if (p.endsWith('uis')) return p.slice(0, -3) + 'ul';
    if (p.endsWith('res') || p.endsWith('zes')) return p.slice(0, -2);
    if (p.endsWith('ns'))  return p.slice(0, -2) + 'm';
    if (p.endsWith('es') && p.length > 4) return p.slice(0, -2);
    if (p.endsWith('s') && !p.endsWith('ss') && p.length > 3) return p.slice(0, -1);
    return p;
  }

  function limparRuidoLista(linha) {
    return linha
      .replace(/^[\s\t]*[•\-\*\+\~\–\—\>]+[\s\t]*/g, '')
      .replace(/^[\s\t]*(\d+[\.\)\-\s]*(x|un|unid)?)\s*/gi, '')
      .replace(/\b(um|uma|dois|duas|tres|quatro|cinco)\b/gi, '')
      .trim();
  }

  function processarItens() {
    const raw = document.getElementById('input-lista').value;
    if (!raw.trim()) {
      alert("Cole a lista do cliente primeiro.");
      return;
    }

    if (bancoOnline.length === 0) {
      alert("O banco da planilha ainda não carregou ou está vazio.");
      return;
    }

    const linhas = raw.split('\n');
    const encontradas = new Map();

    linhas.forEach(linhaOriginal => {
      const linhaLimpa = limparRuidoLista(linhaOriginal);
      if (!linhaLimpa) return;

      const linhaNormalizada = normalizar(linhaLimpa);
      const palavrasDaLinha = linhaNormalizada
        .split(/[\s,.;/]+/)
        .map(p => radicalizar(p))
        .filter(p => p.length >= 2);

      bancoOnline.forEach(item => {
        const deuMatch = item.gatilhos.some(gatilho => {
          const gNorm = normalizar(gatilho);
          const gRadical = radicalizar(gNorm);
          return linhaNormalizada.includes(gNorm) || palavrasDaLinha.includes(gRadical);
        });

        if (deuMatch && !encontradas.has(item.id)) {
          encontradas.set(item.id, {
            pergunta: item.pergunta,
            categoria: item.gatilhos[0]
          });
        }
      });
    });

    const container = document.getElementById('lista-perguntas-container');
    container.innerHTML = '';

    if (encontradas.size === 0) {
      container.innerHTML = '<div style="text-align:center; padding: 20px; font-size: 0.9rem; color: #555;">Nenhum item da lista bateu com o banco da planilha.</div>';
    } else {
      encontradas.forEach((dado) => {
        const div = document.createElement('div');
        div.className = 'question-row';
        div.innerHTML = `
          <input type="checkbox" checked data-pergunta="${dado.pergunta}">
          <div style="flex: 1;">
            <span class="badge-tag">${dado.categoria.toUpperCase()}</span>
            <div style="font-size: 0.95rem; line-height: 1.3;">${dado.pergunta}</div>
          </div>
        `;
        container.appendChild(div);
      });
    }

    irPara('screen-perguntas');
  }

  function copiarMensagemPronta() {
    const marcados = document.querySelectorAll('#lista-perguntas-container input[type="checkbox"]:checked');
    if (marcados.length === 0) {
      alert("Nenhuma pergunta marcada para copiar.");
      return;
    }

    let msg = "Olá! Para planejarmos o veículo certinho e passar o valor do frete, você poderia me confirmar alguns detalhes?\n\n";
    marcados.forEach((c, idx) => {
      msg += `${idx + 1}. ${c.getAttribute('data-pergunta')}\n\n`;
    });
    msg += "Além disso: nos endereços de retirada e entrega o acesso é térreo, elevador ou escadas?";

    navigator.clipboard.writeText(msg.trim()).then(() => {
      alert("Perguntas copiadas!");
    });
  }

  function renderizarTabela() {
    const corpo = document.getElementById('tabela-cadastros');
    document.getElementById('total-cadastrados').textContent = bancoOnline.length;
    corpo.innerHTML = '';

    if (bancoOnline.length === 0) {
      corpo.innerHTML = '<tr><td colspan="2" style="text-align:center; padding: 12px; color: #777;">Nenhum item na planilha.</td></tr>';
      return;
    }

    bancoOnline.forEach(item => {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${item.gatilhos.map(g => `<span class="badge-tag">${g}</span>`).join(' ')}</td>
        <td>${item.pergunta}</td>
      `;
      corpo.appendChild(tr);
    });
  }

  document.addEventListener('DOMContentLoaded', carregarDadosPlanilha);
</script>

</body>
</html>
